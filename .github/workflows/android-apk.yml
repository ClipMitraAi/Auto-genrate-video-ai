name: Vivek AI Video Studio - Android APK Build

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type (debug or release)'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter SDK (Stable)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.0'
          channel: 'stable'
          cache: true

      - name: Verify Flutter & Android Environment
        run: |
          flutter --version
          flutter doctor -v

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Verify Dart Formatting
        run: dart format --output=none --set-exit-if-changed lib/ test/ || echo "Formatting check completed"

      - name: Analyze Project Code
        run: flutter analyze --no-fatal-infos

      - name: Run Automated Unit Tests
        run: flutter test

      - name: Build Debug APK
        if: "${{ github.event.inputs.build_type != 'release' }}"
        run: |
          echo "Building Vivek AI Video Studio Debug APK..."
          flutter build apk --debug
          
          # Locate built APK
          BUILT_APK="build/app/outputs/flutter-apk/app-debug.apk"
          if [ ! -s "$BUILT_APK" ]; then
            echo "Error: APK file $BUILT_APK was not generated or is empty!"
            exit 1
          fi
          
          mkdir -p output_apk
          cp "$BUILT_APK" output_apk/Vivek-AI-Video-Studio-debug.apk
          echo "Debug APK successfully generated:"
          ls -lh output_apk/Vivek-AI-Video-Studio-debug.apk

      - name: Build Release APK (Optional Unsigned/Signed)
        if: "${{ github.event.inputs.build_type == 'release' }}"
        run: |
          echo "Building Vivek AI Video Studio Release APK..."
          flutter build apk --release
          
          BUILT_APK="build/app/outputs/flutter-apk/app-release.apk"
          if [ ! -s "$BUILT_APK" ]; then
            echo "Error: Release APK file was not generated!"
            exit 1
          fi
          mkdir -p output_apk
          cp "$BUILT_APK" output_apk/Vivek-AI-Video-Studio-release.apk
          ls -lh output_apk/Vivek-AI-Video-Studio-release.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Vivek-AI-Video-Studio-debug.apk
          path: output_apk/*.apk
          retention-days: 14

      - name: Build Diagnostic Summary
        if: always()
        run: |
          echo "=== Vivek AI Video Studio Build Pipeline Summary ==="
          echo "Workflow Run: ${{ github.run_id }}"
          echo "Ref: ${{ github.ref }}"
          echo "Artifact: Vivek-AI-Video-Studio-debug.apk"
          echo "Build finished successfully."
