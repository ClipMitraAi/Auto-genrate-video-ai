name: vivek_ai_video_studio
description: "Vivek AI Video Studio - Free Android APK for AI Script to Video, Audio Narration, Subtitles, and Video Creation."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'
  flutter: '>=3.16.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # UI and Material 3
  cupertino_icons: ^1.0.6
  google_fonts: ^6.2.1

  # Audio & Speech
  flutter_tts: ^4.2.2
  audioplayers: ^6.1.0

  # Storage & Utilities
  shared_preferences: ^2.3.2
  path_provider: ^2.1.4
  file_picker: ^8.1.4
  share_plus: ^10.1.2
  permission_handler: ^11.3.1
  intl: ^0.19.0
  uuid: ^4.5.1
  http: ^1.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/sample_media/
    - assets/icons/
